[Service]
RuntimeDirectory=eryu-caddy-config
RuntimeDirectoryMode=0700
RuntimeDirectoryPreserve=no
Environment=XDG_CONFIG_HOME=/run/eryu-caddy-config
ExecStartPre=/usr/bin/install -d -m 0700 /run/eryu-caddy-config/caddy
ExecStartPre=/usr/bin/ln -sfnT /dev/null /run/eryu-caddy-config/caddy/autosave.json
LoadCredentialEncrypted=ERYU_BASIC_AUTH_ENTRY:/etc/credstore.encrypted/eryu/ERYU_BASIC_AUTH_ENTRY.cred
