[Service]
ExecStart=
ExecStart=/opt/caddy-candidates/v2.11.4/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
ExecReload=
ExecReload=/opt/caddy-candidates/v2.11.4/caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile --force --address unix//run/caddy/admin.sock
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
RuntimeDirectoryPreserve=no
